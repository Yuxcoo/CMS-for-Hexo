name: Build and Publish GHCR Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cms-for-hexo"
          ref_name="${GITHUB_REF_NAME//\//-}"
          sha_tag="sha-${GITHUB_SHA::7}"

          tags=("${image}:${sha_tag}")
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            tags+=("${image}:${ref_name}")
            if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
              tags+=("${image}:latest")
            fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=("${image}:${ref_name}")
          fi

          build_args=()
          for tag in "${tags[@]}"; do
            build_args+=("-t" "$tag")
          done

          docker build --platform linux/amd64 "${build_args[@]}" .
          for tag in "${tags[@]}"; do
            docker push "$tag"
          done
